[pytest]
pythonpath = .
testpaths = tests
# Per-test timeout (pytest-timeout, 2026-09-20). GUI tests hang — this names
# WHICH test did, instead of the outer `timeout` killing the run silently.
# method=thread on purpose: the default signal method cannot interrupt a test
# stuck inside Qt's event loop or native code, and thread also dumps the stacks
# of every thread, which is the part that actually says where it hung.
timeout = 60
timeout_method = thread
norecursedirs = files old arch test_sample logs changes .venv venv .git diagnostics
# pytest-qt (2026-09-24, plan_2026_09_24_kq_pytest_qt). qt_api is explicit, not
# auto-detected: a machine can carry PySide6 as well, and what was measured
# (diagnostics/probe_slot_excepthook.py) is PyQt6's behaviour.
qt_api = pyqt6
# required_plugins is the PROTECTION, not decoration. pytest-qt attaches itself
# automatically (pytest11 entry point), so a forgotten `pip install -e ".[dev]"`
# would silently bring back the core dump it exists to remove — and `timeout = 60`
# above does nothing at all without pytest-timeout. The project runs on three
# machines (techdocs/me/deepseek.md §41); this line turns that forgotten install
# into a loud refusal to start instead of a quietly weakened run.
required_plugins = pytest-qt>=4.5 pytest-timeout>=2.4
markers =
    integration: requires a running KiCad instance and a PCB board (not run in CI)
