[pytest]
pythonpath = .
testpaths = tests
# Per-test timeout (pytest-timeout, 2026-09-20). GUI tests hang — this names
# WHICH test did, instead of the outer `timeout` killing the run silently.
# method=thread on purpose: the default signal method cannot interrupt a test
# stuck inside Qt's event loop or native code, and thread also dumps the stacks
# of every thread, which is the part that actually says where it hung.
timeout = 60
timeout_method = thread
norecursedirs = files old arch test_sample logs changes .venv venv .git diagnostics
markers =
    integration: requires a running KiCad instance and a PCB board (not run in CI)
