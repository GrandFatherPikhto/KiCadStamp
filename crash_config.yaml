# Конфиг для tools/repeat_first_write_crash.py (issue #24966).
# Все поля переопределяются одноимёнными CLI-флагами (--project, --runs, ...) —
# то, что задано в командной строке, всегда побеждает конфиг.
project: D:/Projects/KiCad/3CH-AWG-TIA/3CH-AWG-TIA-v102/3CH-AWG-TIA-v102.kicad_pro
boards_dir: boards
runs: 5
startup_wait: 30.0
settle_delay: 0.0

# Только для Windows (читается, только если os.name == "nt" — на Linux запуск
# по Flatpak app id, путь к бинарнику не нужен). Если на машине несколько
# версий KiCad бок о бок — проверьте, что путь ведёт именно на KiCad 10, а не
# на старую 9.x.
windows:
  kicad_exe: "C:\\Users\\grand\\AppData\\Local\\Programs\\KiCad\\10.0\\bin\\kicad.exe"

# Только для Linux (читается, только если os.name != "nt"). Два независимых способа
# выбрать сборку:
#   kicad_exe — прямой запуск исполняемого файла/обёртки, в обход Flatpak (например,
#     nightly, которого во Flatpak просто нет — там только stable/beta). Если задан,
#     побеждает flatpak_branch ниже.
#   flatpak_branch — ветка org.kicad.KiCad, если их несколько бок о бок (stable + beta).
# Оба не заданы/закомментированы -> обычный org.kicad.KiCad (stable) через flatpak run.
linux:
  kicad_exe: "/usr/bin/kicad-nightly"
#  flatpak_branch: beta
