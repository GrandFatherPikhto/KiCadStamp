# .aider.conf.yml — политика ПРОЕКТА для aider.
#
# Читается вторым из трёх: ~/.aider.conf.yml -> ЭТОТ -> .aider.conf.yml рядом
# (aider/main.py:464-496; каждый следующий перекрывает предыдущий).
#
# Здесь ТОЛЬКО то, что одинаково на любой машине и для любого исполнителя.
# Личное и машинное (модель, абсолютные пути, read: с правилами) — в домашний,
# он этот файл перекроет.
#
# Руководство: techdocs/manuals/aider.md

# ── Тесты ──────────────────────────────────────────────────────────────────
# timeout ОБЯЗАТЕЛЕН: GUI-тесты умеют виснуть, без него aider ждёт вечно.
# --ignore=tests/integration_tests ОБЯЗАТЕЛЕН: они пишут на живую плату
# и оставляют по две via за прогон.
# Запускать aider из оболочки с активированным .venv — тогда `python` тот самый.
test-cmd: "timeout 700 python -m pytest tests -q --ignore=tests/integration_tests -p no:cacheprovider"
auto-test: true

# ── История ────────────────────────────────────────────────────────────────
# Коммиты этого проекта идут без подписи инструмента: ни "(aider)" в авторе,
# ни строки в сообщении.
attribute-author: false
attribute-committer: false
attribute-commit-message-author: false
attribute-commit-message-committer: false

# ── Контекст ───────────────────────────────────────────────────────────────
# 597 файлов, ~218 тыс. строк — карте нужно больше места, чем по умолчанию.
map-tokens: 4096

read:
  - /home/yevstigneyevda/Projects/Python/KiCadStamp/techdocs/me/deepseek.md
  - /home/yevstigneyevda/Projects/Python/KiCadStamp/techdocs/me/door.md
  - /home/yevstigneyevda/Projects/Python/KiCadStamp/techdocs/me/i18troubles.md