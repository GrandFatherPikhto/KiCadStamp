# CI — unit test suite only.
#
# Integration tests (tests/integration_tests/, marked @pytest.mark.integration)
# require a running KiCad instance with an active board and a listening IPC
# socket, so they are deliberately excluded here and only run locally on
# demand. The exact suite command mirrors the local dev command:
#   python -m pytest --ignore=tests/integration_tests -m "not integration"
#
# Reference platform: Python 3.12 (matches the project's dev venv). Both
# Linux and Windows legs are exercised because the project targets both (the
# GUI / native-crash hardening work was Windows-specific; unit tests are
# OS-agnostic pure Python + PyQt6 offscreen).
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.12" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # PyQt6 needs a few Qt runtime libraries to run headless (the GUI
      # tests set QT_QPA_PLATFORM=offscreen themselves in tests/gui/conftest.py).
      - name: Install Qt runtime libraries (Linux, headless)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      # requirements.txt carries the RUNTIME pins AND the test toolchain (pytest,
      # pytest-timeout, pytest-qt) since 2026-09-24: it used to be runtime-only, so
      # the `python -m pytest` below had no runner in the environment at all.
      # pytest.ini lists all three plugins in `required_plugins`, so a missing one
      # refuses the run loudly instead of silently weakening it
      # (plan_2026_09_24_kq_pytest_qt).
      - name: Install dependencies (runtime + test toolchain)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit test suite (integration excluded)
        run: python -m pytest --ignore=tests/integration_tests -m "not integration" -q
