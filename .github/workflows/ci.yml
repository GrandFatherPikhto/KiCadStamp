# CI — unit test suite only.
#
# Integration tests (tests/integration_tests/, marked @pytest.mark.integration)
# require a running KiCad instance with an active board and a listening IPC
# socket, so they are deliberately excluded here and only run locally on
# demand. The exact suite command mirrors the local dev command:
#   python -m pytest --ignore=tests/integration_tests -m "not integration" -n auto
#
# Python versions (Д-7, decision of Denis 26.10.2026): 3.12 is the LOWEST
# supported version — it is what `requires-python` promises, so it is what the
# lower bound must be tested on — and 3.14 is the version the project is
# developed and accepted on. 3.10/3.11 were promised by `requires-python` but
# tested by nobody; that gap is what this matrix closes.
#
# Both Linux and Windows legs are exercised because the project targets both
# (the GUI / native-crash hardening work was Windows-specific; unit tests are
# OS-agnostic pure Python + PyQt6 offscreen).
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.12", "3.14" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # uv is the LOCK toolchain. The guard below regenerates requirements.txt with
      # the SAME uv version the lock was authored with (0.13.1): a different uv may
      # format the file differently and the guard would redden on nothing.
      - name: Set up uv (lock toolchain, pinned)
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.1"

      # PyQt6 needs a few Qt runtime libraries to run headless (the GUI
      # tests set QT_QPA_PLATFORM=offscreen themselves in tests/gui/conftest.py).
      - name: Install Qt runtime libraries (Linux, headless)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      # The pin SOURCE is pyproject.toml; requirements.txt is a lock GENERATED from
      # it with uv (`--extra dev --extra mcp --universal`). This guard runs on one
      # leg only and fails when a pin or an extra changed without regenerating the
      # lock — the failure behind the 25.08–01.10 CI red: the hand-kept copy had
      # lost `mcp`, `psutil` and `python-ptrace`. Rule and command: docs/tests.md.
      #
      # `--python-version 3.12` is NOT optional and is NOT derived from
      # `requires-python`: `uv pip compile --universal` starts from the version of
      # the interpreter it RUNS ON, so the same command produced different locks on
      # different machines — this guard failed in CI (Python 3.12) on a lock
      # generated on a dev machine (3.14). The difference is four `# via` comment
      # lines for `typing-extensions` (httpx2, kicad-python, referencing,
      # starlette require it only below 3.13), never a package version. Pinning the
      # version in the command makes the lock independent of where it was built.
      #
      # 3.12 in the command is now ALSO the lowest supported version, i.e.
      # `requires-python`'s own bound: the lock is resolved for the oldest
      # interpreter that must work (Д-7). The step itself runs on ONE leg — Linux +
      # 3.12: the lock is OS/version independent by construction, and four
      # identical runs would only make the signal noisier.
      - name: requirements.txt is in sync with pyproject.toml (Linux, Python 3.12)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          uv pip compile pyproject.toml --extra dev --extra mcp --universal --python-version 3.12 -o requirements.txt
          if ! git diff --exit-code -- requirements.txt; then
            echo "::error::requirements.txt is STALE — regenerate and commit both files:"
            echo "  uv pip compile pyproject.toml --extra dev --extra mcp --universal --python-version 3.12 -o requirements.txt"
            exit 1
          fi

      # The lock is installed as-is, then the package itself with --no-deps: every
      # dependency is already pinned by the lock, so pip has nothing to resolve.
      - name: Install dependencies (lock + package, no deps)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Run unit test suite (integration excluded, skip reasons printed)
        # `-rsf`, and NOT a bare `-rs`: pytest's `-r` REPLACES the default report
        # set ('fE'), so `-rs` alone prints the skip reasons and DROPS the FAILED
        # lines from `short test summary info`. Measured 01.10.2026 (Ф3.6): the
        # reference run with `-rs` showed 12 SKIPPED and no FAILED line at all —
        # it would have made the log harder to triage, not easier.
        # `-n auto` (pytest-xdist, 03.10.2026): one worker per runner core. Locally
        # on 24 cores each leg went 3 min -> 40 s with the same 6227 passed.
        run: python -m pytest --ignore=tests/integration_tests -m "not integration" -q -rsf -n auto

      # The Windows-tick run (Ф3.7). Windows is where a second write inside one
      # filesystem tick broke readers cached by `(path, mtime_ns)`; the probe that
      # FORCES that tick on Linux found ELEVEN such cells here (Actions #656's red
      # Windows leg among them). Running the suite a second time under the option
      # catches the class on every push instead of waiting for the Windows leg —
      # and catches a future PRODUCT writer that forgets to invalidate its own
      # caches after its write. Linux only: the Windows leg gets the real thing for
      # free. The option is in tests/conftest.py; docs/tests.md says how to run it
      # locally.
      - name: Run unit test suite under the forced one-tick filesystem (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest --ignore=tests/integration_tests -m "not integration" -q -rsf -n auto --coarse-mtime
