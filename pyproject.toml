[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kicadstamp"
description = "KiCad placement automation: spokes, vias, tracks and channel cloning over the KiCad IPC API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Denis" }]
dynamic = ["version"]
dependencies = [
    "kicad-python==0.7.1",
    "PyYAML==6.0.3",
    "sexpdata==1.0.2",
    "PyQt6==6.11.0",
    "pynng==0.9.0",
    "protobuf==5.29.6",
    "python-ptrace==0.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    # Per-TEST timeout with a thread dump (2026-09-20). The outer `timeout 700`
    # in every run command stays: it guards against pytest itself hanging, but
    # it kills the whole run and names nothing. This one names the test and
    # prints where it hung — see pytest.ini's timeout_method.
    "pytest-timeout==2.4.0",
    # pytest-qt (2026-09-24, plan_2026_09_24_kq_pytest_qt). PyQt6 calls qFatal()
    # when an exception escapes a Qt SLOT and sys.excepthook is the default one:
    # measured `Fatal Python error: Aborted`, EXIT=134, the whole run gone — and in
    # diagnostics/run_board_door_offender_mutations.py that same dump READ AS "every
    # watchdog survived". pytest-qt replaces the hook on every test phase and turns
    # such an exception into a FAILED that names the file and line of the refusal.
    # Dev-only: the battle code keeps its own hook untouched (see the plan's §7).
    "pytest-qt==4.5.0",
    "babel==2.18.0",
    "pyflakes==3.4.0",
]
diagnostics = [
    "numpy==2.5.1",
    "scipy==1.18.0",
    "psutil==7.2.2",
    "rich==15.0.0",
    "watchdog==6.0.0",
]
# MCP server (mcp_server/) — optional: only needed to run the stdio MCP server,
# not for GUI/CLI/tests. mcp 2.x renamed FastMCP to MCPServer (verified 2026-08-29).
mcp = [
    "mcp==2.1.1",
]

[project.scripts]
kicadstamp = "kicadstamp.cli_main:main"
kicadstamp-gui = "kicadstamp.gui_main:main"
kicadstamp-mcp = "mcp_server.server:main"

[tool.setuptools.dynamic]
version = { attr = "kicadstamp._version.__version__" }

[tool.setuptools.packages.find]
include = ["kicadstamp*", "gui*", "mcp_server*"]

[tool.setuptools.package-data]
# Locales stay at the repo-root locales/ for now (source checkout layout);
# i18n.py falls back to them. Moving locales into kicadstamp/ for packaged
# translations is a follow-up (see the 2026-08-25 architecture audit P0-1).
"*" = ["*.mo", "*.po"]
